name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject declara requires-python >=3.10, así que se prueban los
        # extremos de lo que se promete soportar y no solo el del que desarrolla.
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      # Git for Windows trae core.autocrlf=true: el checkout dejaría los schemas
      # en CRLF y dejarían de coincidir con su hash en spec/frozen.sha256.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Historia completa: la suite verifica que el SHA pineado del
          # auto-gate sea un objeto commit, y en un clon superficial ese
          # ancestro de main directamente no existe en el object store.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
  conformidad-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plano-evidencia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run conformidad
      - run: npm test
      - run: npm run typecheck

  # Este repositorio se aplica su propio gate, con la version publicada y no con
  # el codigo del PR: el juez no puede venir del arbol que se esta juzgando. Solo
  # en pull_request, porque sin rango el gate falla cerrado y en push no hay.
  #
  # Pineado por SHA y no por tag, que es lo que el README exige como requisito de
  # despliegue: un tag se puede mover, asi que no es raiz de confianza para el
  # codigo que decide si un merge se permite. Predicar una cosa y hacer otra en
  # el propio repositorio es peor que no predicarla.
  residuo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: NicolasRocchia/disensor@d518e12b262605ecca8d637e9dd07749b20a1281  # v0.14.0
