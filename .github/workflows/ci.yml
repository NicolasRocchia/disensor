name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declara requires-python >=3.10, así que se prueban los
        # extremos de lo que se promete soportar y no solo el del que desarrolla.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
  conformidad-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plano-evidencia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run conformidad
      - run: npm run typecheck

  # Este repositorio se aplica su propio gate, con la version publicada y no con
  # el codigo del PR: el juez no puede venir del arbol que se esta juzgando. Solo
  # en pull_request, porque sin rango el gate falla cerrado y en push no hay.
  residuo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: NicolasRocchia/disensor@v0.4.0
