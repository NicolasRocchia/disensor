name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Publica a PyPI via Trusted Publishing (OIDC): PyPI confia en la tripleta
# (este repo, este workflow, el environment pypi) y no hay token en ninguna
# maquina ni secreto en el repo. El publicador esta pineado por SHA al commit
# del tag v1.9.0 y no a la rama release/v1, por el mismo motivo que el gate
# en ci.yml: una referencia movil no es raiz de confianza para codigo que
# sube artefactos a nombre del proyecto.
permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0  # v1.9.0
