name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag o SHA a construir y publicar (backfill). Obligatorio: un dispatch sin ref construiria la rama del momento, no el arbol del tag.'
        required: true

# Publica a PyPI via Trusted Publishing (OIDC): PyPI confia en la tripleta
# (este repo, este workflow, el environment pypi) y no hay token en ninguna
# maquina ni secreto en el repo. Build y publish van en jobs separados a
# proposito: el job que compila ejecuta codigo de terceros (el backend de
# build y sus dependencias) y no debe portar la identidad OIDC que puede
# impersonar al repo frente a PyPI. El publicador esta pineado por SHA al
# commit del tag v1.14.2 y no a la rama release/v1, por el mismo motivo que
# el gate en ci.yml: una referencia movil no es raiz de confianza para
# codigo que sube artefactos a nombre del proyecto.
permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
