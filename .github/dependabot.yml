version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # El pin del auto-gate sube a mano despues de cada release, en un PR
      # que lleva su ronda; un PR de Dependabot no trae declaracion.
      - dependency-name: "NicolasRocchia/disensor"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
