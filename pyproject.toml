[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residuo"
version = "0.1.0"
description = "Declaracion de residuo de revision adversarial (desacuerdo controlado): schema, validador y gate de CI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nicolas Rocchia", email = "nicolasrocchia@gmail.com" }]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
residuo = "residuo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
residuo = ["residuo.schema.json"]
