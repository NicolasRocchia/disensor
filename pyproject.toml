[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disensor"
version = "0.1.0"
description = "disensor: adversarial plan & code review with a declared residue. Emite, valida y hace cumplir en CI declaraciones de residuo (esquema residuo/v0.1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nicolas Rocchia", email = "nicolasrocchia@gmail.com" }]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
disensor = "disensor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disensor = ["residuo.schema.json"]
