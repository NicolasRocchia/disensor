# Copiar a .github/workflows/disensor.yml en el repositorio consumidor
# (o dejar que `disensor init` lo escriba solo).
name: disensor
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el gate necesita el rango de commits del PR (chequeo G5)
      - uses: NicolasRocchia/disensor@v0.2.0
        # Mientras el repo de la Action sea privado o local, usar la ruta relativa:
        # uses: ./disensor
