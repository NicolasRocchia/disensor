# Copiar a .github/workflows/residuo.yml en el repositorio consumidor.
name: residuo
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el gate necesita el rango de commits del PR (chequeo G5)
      - uses: nicolasrocchia/residuo@v0.1.0
        # Mientras el repo de la Action sea privado o local, usar la ruta relativa:
        # uses: ./residuo
