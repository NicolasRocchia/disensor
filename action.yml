name: 'Disensor Gate'
description: 'Validates the adversarial-review residue declaration of a PR (controlled disagreement) and posts the declaration as a comment.'
author: 'Nicolas Rocchia'
branding:
  icon: 'shield'
  color: 'orange'
inputs:
  github-token:
    description: 'Token to post the comment on the PR.'
    required: false
    default: ${{ github.token }}
  directory:
    description: 'Directory of residue artifacts inside the repo.'
    required: false
    default: '.residue'
  config:
    description: 'Gate configuration file in the repo.'
    required: false
    default: 'disensor.config.json'
  python-version:
    description: 'Python version for the gate: CPython 3.10 or later. Dependencies install from wheels only, so a version without a wheel for every locked dependency cannot run it (3.13 free-threaded and 3.10 on Windows ARM, today).'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    # `-I` (isolated) is load bearing, not tidiness. The steps of a composite
    # action run with the working directory set to the checkout of the PR, and
    # `python -m` puts that directory first on sys.path. Without isolation, a PR
    # that adds `pip/__init__.py` and `pip/__main__.py` to its own root runs its
    # own pip here, installs whatever it wants as `disensor`, and the next step
    # hands it the verdict. Pinning this action by SHA does not help: the
    # hijacked code comes from the tree being judged.
    #
    # Nothing is resolved at run time: dependencies come from the hashed lock,
    # as wheels, and disensor builds with the locked setuptools. The venv is
    # load bearing too: `--require-hashes` only checks what pip downloads, and
    # a package already installed at the locked version, as the interpreter of
    # a self-hosted runner can carry, would be accepted without its hash.
    - name: Install disensor
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VENV: ${{ runner.temp }}/disensor-venv
        BIN: ${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
      run: |
        python -I -m venv --clear "$VENV"
        "$VENV/$BIN" -I -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps --only-binary :all: -r "$ACTION_PATH/requirements-action.txt"
        "$VENV/$BIN" -I -m pip install --quiet --disable-pip-version-check --no-deps --no-build-isolation --no-index "$ACTION_PATH"
        echo "python=$VENV/$BIN" >> "$GITHUB_OUTPUT"
    - name: Run the gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DISENSOR_PYTHON: ${{ steps.install.outputs.python }}
      run: |
        "$DISENSOR_PYTHON" -I -m disensor gate --directory "${{ inputs.directory }}" --config "${{ inputs.config }}"
