name: 'Disensor Gate'
description: 'Valida la declaracion de residuo de revision adversarial de un PR (desacuerdo controlado) y publica la declaracion como comentario.'
author: 'Nicolas Rocchia'
branding:
  icon: 'shield'
  color: 'orange'
inputs:
  github-token:
    description: 'Token para publicar el comentario en el PR.'
    required: false
    default: ${{ github.token }}
  directorio:
    description: 'Directorio de artefactos de residuo dentro del repo.'
    required: false
    default: '.residuo'
  config:
    description: 'Archivo de configuracion del gate en el repo.'
    required: false
    default: 'disensor.config.json'
  python-version:
    description: 'Version de Python para el gate.'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Preparar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Instalar disensor
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Correr el gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: disensor gate --directorio "${{ inputs.directorio }}" --config "${{ inputs.config }}"
