name: 'Disensor Gate'
description: 'Validates the adversarial-review residue declaration of a PR (controlled disagreement) and posts the declaration as a comment.'
author: 'Nicolas Rocchia'
branding:
  icon: 'shield'
  color: 'orange'
inputs:
  github-token:
    description: 'Token to post the comment on the PR.'
    required: false
    default: ${{ github.token }}
  directory:
    description: 'Directory of residue artifacts inside the repo.'
    required: false
    default: '.residue'
  config:
    description: 'Gate configuration file in the repo.'
    required: false
    default: 'disensor.config.json'
  python-version:
    description: 'Python version for the gate.'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install disensor
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Run the gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: disensor gate --directory "${{ inputs.directory }}" --config "${{ inputs.config }}"
